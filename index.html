function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw){
      const seeded = seedDB();
      localStorage.setItem(DB_KEY, JSON.stringify(seeded));
      return seeded;
    }
    return JSON.parse(raw);
  }catch(e){
    const seeded = seedDB();
    localStorage.setItem(DB_KEY, JSON.stringify(seeded));
    return seeded;
  }
}

function persistDB(db){
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

/* ------------------------------ Utilidades ------------------------------ */

function formatBRL(v){
  return new Intl.NumberFormat("pt-BR", { style:"currency", currency:"BRL" }).format(v || 0);
}
function formatDateTime(iso){
  if(!iso) return "-";
  const d = new Date(iso);
  return d.toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}
function toDatetimeLocal(iso){
  const d = iso ? new Date(iso) : new Date();
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function computeStock(item, movements){
  let stock = Number(item.initialStock || 0);
  for(const m of movements){
    if(m.itemId !== item.id) continue;
    if(m.type === "entrada") stock += Number(m.quantity);
    else if(m.type === "saida") stock -= Number(m.quantity);
    else if(m.type === "devolucao") stock += Number(m.quantity);
    else if(m.type === "ajuste") stock += Number(m.quantity);
  }
  return stock;
}

/* -------------------------------- Toast ---------------------------------- */

function useToast(){
  const [toast, setToast] = useState(null);
  const timerRef = useRef(null);
  const show = useCallback((message, type="info") => {
    setToast({ message, type, key: Date.now() });
    if(timerRef.current) clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => setToast(null), 3200);
  }, []);
  return [toast, show];
}

function Toast({ toast }){
  if(!toast) return null;
  const colors = {
    success: "border-l-[var(--green)]",
    error: "border-l-[var(--red)]",
    info: "border-l-[var(--amber)]",
  };
  const icon = toast.type === "success" ? "check" : toast.type === "error" ? "x-circle" : "alert";
  return (
    <div key={toast.key} className={`fixed top-3 left-1/2 -translate-x-1/2 z-[200] w-[92%] max-w-sm anim-toast`}>
      <div className={`bg-[var(--surface2)] border border-[var(--border)] ${colors[toast.type]||colors.info} border-l-4 rounded-lg shadow-2xl px-4 py-3 flex items-center gap-3`}>
        <Icon name={icon} size={20} className={toast.type==="success"?"text-[var(--green)]":toast.type==="error"?"text-[var(--red)]":"text-[var(--amber)]"} />
        <p className="text-sm text-[var(--text)] leading-snug">{toast.message}</p>
      </div>
    </div>
  );
}

function ScannerModal({ onClose, onDetected, showToast }){
  const regionId = "daga-scanner-region";
  const scannerRef = useRef(null);
  const [status, setStatus] = useState("iniciando"); // iniciando | ativo | erro
  const [errorMsg, setErrorMsg] = useState("");
  const handledRef = useRef(false);

  useEffect(() => {
    let cancelled = false;
    if(!window.Html5Qrcode){
      setStatus("erro");
      setErrorMsg("Biblioteca de leitura não carregada. Verifique sua conexão com a internet.");
      return;
    }
    const instance = new window.Html5Qrcode(regionId, { verbose:false });
    scannerRef.current = instance;

    instance.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.4 },
      (decodedText) => {
        if(handledRef.current) return;
        handledRef.current = true;
        onDetected(decodedText);
      },
      () => { /* ignora frames sem leitura */ }
    ).then(() => { if(!cancelled) setStatus("ativo"); })
     .catch((err) => {
        if(cancelled) return;
        setStatus("erro");
        const msg = String(err || "");
        if(msg.toLowerCase().includes("permission") || msg.toLowerCase().includes("notallowed")){
          setErrorMsg("Permissão de câmera negada. Autorize o acesso à câmera nas configurações do navegador.");
        }else if(msg.toLowerCase().includes("notfound")){
          setErrorMsg("Nenhuma câmera encontrada neste dispositivo.");
        }else{
          setErrorMsg("Não foi possível acessar a câmera. Tente novamente ou digite o código manualmente.");
        }
      });

    return () => {
      cancelled = true;
      if(scannerRef.current){
        scannerRef.current.stop().then(() => scannerRef.current.clear()).catch(() => {});
      }
    };
  }, []);

  const close = () => {
    if(scannerRef.current){
      scannerRef.current.stop().then(() => scannerRef.current.clear()).catch(() => {});
    }
    onClose();
  };

  return (
    <div className="fixed inset-0 z-[190] bg-black flex flex-col anim-fade">
      <div className="flex items-center justify-between px-4 py-4 shrink-0">
        <div>
          <p className="font-display uppercase tracking-wide font-semibold text-white">Escanear Código</p>
          <p className="text-xs text-[var(--dim)]">Aponte a câmera para o código de barras ou QR Code</p>
        </div>
        <button onClick={close} className="w-10 h-10 rounded-full bg-[var(--surface2)] flex items-center justify-center btn-press">
          <Icon name="close" size={18} className="text-white"/>
        </button>
      </div>

      <div className="flex-1 relative flex items-center justify-center px-4">
        <div id={regionId} className="w-full max-w-sm rounded-2xl overflow-hidden bg-[var(--surface)]"></div>
        {status === "iniciando" && (
          <div className="absolute inset-0 flex flex-col items-center justify-center gap-3 pointer-events-none">
            <Icon name="qr" size={40} className="text-[var(--amber)] animate-pulse"/>
            <p className="text-sm text-[var(--dim)]">Iniciando câmera...</p>
          </div>
        )}
        {status === "erro" && (
          <div className="absolute inset-0 flex flex-col items-center justify-center gap-3 px-6 text-center">
            <Icon name="alert" size={36} className="text-[var(--red)]"/>
            <p className="text-sm text-[var(--text)]">{errorMsg}</p>
            <button onClick={close} className="btn-press mt-2 rounded-xl px-5 py-2.5 bg-[var(--surface2)] border border-[var(--border)] text-sm font-semibold text-white">Fechar e digitar manualmente</button>
          </div>
        )}
      </div>

      <div className="p-4 shrink-0">
        <p className="text-center text-[11px] text-[var(--dim)] mb-3">Suporta códigos de barras (CODE128, EAN) e QR Code</p>
        <button onClick={close} className="btn-press w-full rounded-2xl py-4 bg-[var(--surface2)] border border-[var(--border)] font-display font-semibold uppercase tracking-wide text-white">Cancelar</button>
      </div>
    </div>
  );
}

    if(!name.trim()){ showToast("Informe o nome da categoria.", "error"); return; }
    if(modal.mode === "new"){
      setCategories(prev => [...prev, { id: uid("cat"), name: name.trim(), color }]);

      <ConfirmDialog open={!!confirm} title="Excluir categoria?" message={`Tem certeza que deseja excluir "${confirm?.name}"? Esta ação não pode ser desfeita.`} onConfirm={()=>remove(confirm)} onCancel={()=>setConfirm(null)} />
    </div>
  );
}

function SuppliersScreen({ suppliers, setSuppliers, items, showToast }){
  const [modal, setModal] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [form, setForm] = useState({ name:"", cnpj:"", phone:"", email:"" });

  const openNew = () => { setForm({ name:"", cnpj:"", phone:"", email:"" }); setModal({ mode:"new" }); };
  const openEdit = (s) => { setForm({ name:s.name, cnpj:s.cnpj, phone:s.phone, email:s.email }); setModal({ mode:"edit", data:s }); };

  const save = () => {
    if(!form.name.trim()){ showToast("Informe o nome do fornecedor.", "error"); return; }
    if(modal.mode==="new"){
      setSuppliers(prev => [...prev, { id: uid("sup"), ...form, name: form.name.trim() }]);
      showToast("Fornecedor cadastrado.", "success");
    }else{
      setSuppliers(prev => prev.map(s => s.id===modal.data.id ? { ...s, ...form, name: form.name.trim() } : s));
      showToast("Fornecedor atualizado.", "success");
    }
    setModal(null);
  };

  const remove = (s) => {
    const inUse = items.some(i => i.supplierId === s.id);
    if(inUse){ showToast("Não é possível excluir: fornecedor em uso por itens.", "error"); setConfirm(null); return; }
    setSuppliers(prev => prev.filter(x=>x.id!==s.id));
    showToast("Fornecedor excluído.", "success");
    setConfirm(null);
  };

  return (
    <div className="px-4 py-5 pb-24">
      <button onClick={openNew} className="btn-press w-full rounded-2xl py-4 bg-[var(--amber)] text-[#1A1305] font-display font-semibold uppercase tracking-wide flex items-center justify-center gap-2 mb-4 shadow-lg">
        <Icon name="plus" size={20}/> Novo Fornecedor
      </button>
      <div className="space-y-2.5">
        {suppliers.map(s => (
          <div key={s.id} className="bg-[var(--surface)] border border-[var(--border)] rounded-xl p-3.5">
            <div className="flex items-start gap-3">
              <div className="w-10 h-10 rounded-lg bg-[var(--blue)]/15 text-[var(--blue)] flex items-center justify-center shrink-0"><Icon name="truck" size={18}/></div>
              <div className="flex-1 min-w-0">
                <p className="font-medium truncate">{s.name}</p>
                <p className="text-xs text-[var(--dim)] font-mono">{s.cnpj}</p>
                <p className="text-xs text-[var(--dim)]">{s.phone} · {s.email}</p>
              </div>
              <div className="flex flex-col gap-2 shrink-0">
                <button onClick={()=>openEdit(s)} className="w-9 h-9 rounded-lg bg-[var(--surface2)] flex items-center justify-center btn-press"><Icon name="edit" size={16}/></button>
                <button onClick={()=>setConfirm(s)} className="w-9 h-9 rounded-lg bg-[var(--surface2)] flex items-center justify-center btn-press text-[var(--red)]"><Icon name="trash" size={16}/></button>
              </div>
            </div>
          </div>
        ))}
        {suppliers.length===0 && <p className="text-sm text-[var(--dim)] text-center py-8">Nenhum fornecedor cadastrado.</p>}
      </div>

      {modal && (
        <Modal title={modal.mode==="new" ? "Novo Fornecedor" : "Editar Fornecedor"} onClose={()=>setModal(null)}>
          <div className="space-y-4">
            <Field label="Razão Social" required><input className={inputCls+" rounded-xl"} value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></Field>
            <Field label="CNPJ"><input className={inputCls+" rounded-xl"} value={form.cnpj} onChange={e=>setForm({...form,cnpj:e.target.value})} placeholder="00.000.000/0000-00"/></Field>
            <Field label="Telefone"><input className={inputCls+" rounded-xl"} value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="(00) 0000-0000"/></Field>
            <Field label="E-mail"><input className={inputCls+" rounded-xl"} value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="contato@empresa.com.br"/></Field>
            <button onClick={save} className="btn-press w-full rounded-xl py-3.5 bg-[var(--amber)] text-[#1A1305] font-display font-semibold uppercase tracking-wide mt-2">Salvar</button>
          </div>
        </Modal>
      )}

      <ConfirmDialog open={!!confirm} title="Excluir fornecedor?" message={`Tem certeza que deseja excluir "${confirm?.name}"?`} onConfirm={()=>remove(confirm)} onCancel={()=>setConfirm(null)} />
    </div>
  );
}

const emptyItemForm = {
  code:"", name:"", description:"", categoryId:"", supplierId:"", unit:"UN",
  location:"", minStock:0, initialStock:0, cost:0, photo:null, active:true,
};

function ItemForm({ initial, categories, suppliers, onSave, onCancel, showToast }){
  const [form, setForm] = useState(initial || emptyItemForm);
  const [scanning, setScanning] = useState(false);
  const fileRef = useRef(null);

  const set = (k,v) => setForm(prev => ({ ...prev, [k]: v }));

  const handlePhoto = (e) => {
    const file = e.target.files?.[0];
    if(!file) return;
    if(file.size > 3*1024*1024){ showToast("Imagem muito grande (máx. 3MB).", "error"); return; }
    const reader = new FileReader();
    reader.onload = () => set("photo", reader.result);
    reader.readAsDataURL(file);
  };

  const generateCode = () => {
    const rand = Math.floor(Math.random()*9000000000000)+1000000000000;
    set("code", String(rand));
  };

  const submit = () => {
    if(!form.name.trim()) return showToast("Informe o nome do item.", "error");
    if(!form.categoryId) return showToast("Selecione uma categoria.", "error");
    if(!form.supplierId) return showToast("Selecione um fornecedor.", "error");
    if(!form.code.trim()) return showToast("Informe o código de barras/QR.", "error");
    if(Number(form.minStock) < 0 || Number(form.initialStock) < 0) return showToast("Valores de estoque não podem ser negativos.", "error");
    onSave({ ...form, minStock:Number(form.minStock), initialStock:Number(form.initialStock), cost:Number(form.cost) });
  };

  return (
    <div className="space-y-4">
      <div className="flex flex-col items-center">
        <div className="w-28 h-28 rounded-2xl bg-[var(--surface2)] border border-dashed border-[var(--border)] flex items-center justify-center overflow-hidden mb-2">
          {form.photo ? <img src={form.photo} className="w-full h-full object-cover"/> : <Icon name="camera" size={28} className="text-[var(--dim)]"/>}
        </div>
        <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handlePhoto}/>
        <button onClick={()=>fileRef.current?.click()} className="text-xs font-semibold text-[var(--amber)] uppercase tracking-wide">
          {form.photo ? "Trocar foto" : "Adicionar foto"}
        </button>
      </div>

      <Field label="Nome do Item" required><input className={inputCls+" rounded-xl"} value={form.name} onChange={e=>set("name",e.target.value)} placeholder="ex: Luva de Raspa"/></Field>
      <Field label="Descrição"><textarea rows="2" className={inputCls+" rounded-xl resize-none"} value={form.description} onChange={e=>set("description",e.target.value)} placeholder="Detalhes técnicos do item"/></Field>

      <Field label="Código de Barras / QR Code" required hint="Escaneie pela câmera, gere automaticamente ou digite manualmente">
        <div className="flex gap-2">
          <input className={inputCls+" rounded-xl font-mono"} value={form.code} onChange={e=>set("code",e.target.value)} placeholder="0000000000000"/>
          <button onClick={()=>setScanning(true)} className="shrink-0 w-12 rounded-xl bg-[var(--amber)] text-[#1A1305] flex items-center justify-center btn-press"><Icon name="qr" size={18}/></button>
          <button onClick={generateCode} className="shrink-0 w-12 rounded-xl bg-[var(--surface2)] border border-[var(--border)] flex items-center justify-center btn-press"><Icon name="refresh" size={18}/></button>
        </div>
      </Field>

      {scanning && (
        <ScannerModal
          showToast={showToast}
          onClose={()=>setScanning(false)}
          onDetected={(code)=>{ set("code", code); setScanning(false); showToast("Código lido com sucesso.", "success"); }}
        />
      )}

      <div className="grid grid-cols-2 gap-3">
        <Field label="Categoria" required>
          <select className={inputCls+" rounded-xl"} value={form.categoryId} onChange={e=>set("categoryId",e.target.value)}>
            <option value="">Selecione</option>
            {categories.map(c=> <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </Field>
        <Field label="Fornecedor" required>
          <select className={inputCls+" rounded-xl"} value={form.supplierId} onChange={e=>set("supplierId",e.target.value)}>
            <option value="">Selecione</option>
            {suppliers.map(s=> <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </Field>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <Field label="Unidade" required>
          <select className={inputCls+" rounded-xl"} value={form.unit} onChange={e=>set("unit",e.target.value)}>
            {UNITS.map(u=> <option key={u} value={u}>{u}</option>)}
          </select>
        </Field>
        <Field label="Localização" hint="Corredor / prateleira">
          <input className={inputCls+" rounded-xl"} value={form.location} onChange={e=>set("location",e.target.value)} placeholder="ex: A1-03"/>
        </Field>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <Field label="Estoque Mínimo" required>
          <input type="number" min="0" className={inputCls+" rounded-xl"} value={form.minStock} onChange={e=>set("minStock",e.target.value)}/>
        </Field>
        <Field label={initial ? "Estoque Inicial (base)" : "Estoque Inicial"} required hint={initial ? "Alterar recalcula o saldo" : ""}>
          <input type="number" min="0" className={inputCls+" rounded-xl"} value={form.initialStock} onChange={e=>set("initialStock",e.target.value)}/>
        </Field>
      </div>

      <Field label="Custo Unitário (R$)" required>
        <input type="number" min="0" step="0.01" className={inputCls+" rounded-xl"} value={form.cost} onChange={e=>set("cost",e.target.value)}/>
      </Field>

      <label className="flex items-center gap-3 bg-[var(--surface2)] rounded-xl px-3.5 py-3 cursor-pointer">
        <input type="checkbox" checked={form.active} onChange={e=>set("active", e.target.checked)} className="w-5 h-5 accent-[var(--amber)]"/>
        <span className="text-sm font-medium">Item ativo</span>
      </label>

      <div className="flex gap-3 pt-1">
        <button onClick={onCancel} className="btn-press flex-1 rounded-xl py-3.5 bg-[var(--surface2)] border border-[var(--border)] font-semibold">Cancelar</button>
        <button onClick={submit} className="btn-press flex-1 rounded-xl py-3.5 bg-[var(--amber)] text-[#1A1305] font-display font-semibold uppercase tracking-wide">Salvar Item</button>
      </div>
    </div>
  );
}

function BarcodeQr({ code }){
  const barcodeRef = useRef(null);
  const qrRef = useRef(null);
  useEffect(() => {
    if(barcodeRef.current && window.JsBarcode && code){
      try{
        window.JsBarcode(barcodeRef.current, code, { format:"CODE128", background:"transparent", lineColor:"#EAF0F5", width:1.6, height:46, displayValue:false, margin:0 });
      }catch(e){}
    }
    if(qrRef.current && window.QRCode && code){
      qrRef.current.innerHTML = "";
      try{ new window.QRCode(qrRef.current, { text: code, width:88, height:88, colorDark:"#0B1015", colorLight:"#EAF0F5" }); }catch(e){}
    }
  }, [code]);
  return (
    <div className="flex items-center gap-4 bg-[var(--surface2)] rounded-xl p-3.5">
      <div className="bg-[var(--text)]/[0.03] rounded-lg p-2 flex-1 overflow-hidden">
        <svg ref={barcodeRef} className="w-full"></svg>
        <p className="text-center font-mono text-xs text-[var(--dim)] tracking-widest mt-1">{code}</p>
      </div>
      <div ref={qrRef} className="rounded-lg overflow-hidden bg-white p-1.5 shrink-0"></div>
    </div>
  );
}

function ItemDetail({ item, categories, suppliers, movements, onClose, onEdit, onDelete }){
  const cat = categories.find(c=>c.id===item.categoryId);
  const sup = suppliers.find(s=>s.id===item.supplierId);
  const stock = computeStock(item, movements);
  const low = stock <= item.minStock;
  const itemMovs = movements.filter(m=>m.itemId===item.id).sort((a,b)=> new Date(b.datetime)-new Date(a.datetime));

  return (
    <Modal title="Detalhes do Item" onClose={onClose} wide>
      <div className="space-y-4">
        <div className="flex gap-4 items-start">
          <div className="w-24 h-24 rounded-xl bg-[var(--surface2)] overflow-hidden shrink-0 flex items-center justify-center">
            {item.photo ? <img src={item.photo} className="w-full h-full object-cover"/> : <Icon name="box" size={30} className="text-[var(--dim)]"/>}
          </div>
          <div className="min-w-0 flex-1">
            <p className="font-display font-semibold text-lg leading-tight">{item.name}</p>
            <p className="text-xs text-[var(--dim)] mt-1">{item.description || "Sem descrição"}</p>
            <div className="flex flex-wrap gap-1.5 mt-2">
              {cat && <Badge tone="blue">{cat.name}</Badge>}
              <Badge tone={item.active ? "green":"dim"}>{item.active ? "Ativo":"Inativo"}</Badge>
              {low && <Badge tone="red">Estoque Baixo</Badge>}

        </div>

        <BarcodeQr code={item.code} />

        <div className="grid grid-cols-3 gap-2.5">
          <div className="bg-[var(--surface2)] rounded-xl p-3 text-center">
            <p className="font-display text-xl font-bold" style={{ color: low ? "var(--red)" : "var(--text)" }}>{stock}</p>
            <p className="text-[10px] text-[var(--dim)] uppercase mt-0.5">Estoque Atual</p>
          </div>
          <div className="bg-[var(--surface2)] rounded-xl p-3 text-center">
            <p className="font-display text-xl font-bold">{item.minStock}</p>
            <p className="text-[10px] text-[var(--dim)] uppercase mt-0.5">Mínimo</p>
          </div>
          <div className="bg-[var(--surface2)] rounded-xl p-3 text-center">
            <p className="font-display text-xl font-bold">{formatBRL(stock*item.cost)}</p>
            <p className="text-[10px] text-[var(--dim)] uppercase mt-0.5">Valor Total</p>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2.5 text-sm">
          <div className="bg-[var(--surface2)] rounded-xl p-3">
            <p className="text-[10px] text-[var(--dim)] uppercase">Localização</p>
            <p className="font-mono font-semibold">{item.location || "-"}</p>
          </div>
          <div className="bg-[var(--surface2)] rounded-xl p-3">
            <p className="text-[10px] text-[var(--dim)] uppercase">Unidade</p>
            <p className="font-semibold">{item.unit}</p>
          </div>
          <div className="bg-[var(--surface2)] rounded-xl p-3">
            <p className="text-[10px] text-[var(--dim)] uppercase">Fornecedor</p>
            <p className="font-semibold truncate">{sup?.name || "-"}</p>
          </div>
          <div className="bg-[var(--surface2)] rounded-xl p-3">
            <p className="text-[10px] text-[var(--dim)] uppercase">Custo Unitário</p>
            <p className="font-semibold">{formatBRL(item.cost)}</p>
          </div>
        </div>

        <div>
          <p className="text-xs uppercase tracking-widest text-[var(--dim)] font-semibold mb-2">Histórico de Movimentações</p>
          <div className="max-h-52 overflow-y-auto space-y-1.5 pr-1">
            {itemMovs.length===0 && <p className="text-sm text-[var(--dim)]">Nenhuma movimentação registrada.</p>}
            {itemMovs.map(m => {
              const t = MOV_TYPES[m.type];
              return (
                <div key={m.id} className="flex items-center gap-2.5 bg-[var(--surface2)] rounded-lg px-3 py-2">
                  <span className="text-[10px] font-semibold uppercase px-2 py-0.5 rounded-full" style={{ background: t.color+"22", color: t.color }}>{t.label}</span>
                  <span className="text-xs text-[var(--dim)] flex-1 truncate">{formatDateTime(m.datetime)}</span>
                  <span className="font-mono text-sm font-semibold" style={{ color: t.color }}>{m.type==="ajuste" ? (m.quantity>0?"+":"") : m.type==="saida" ? "-" : "+"}{m.quantity}</span>

        <div className="flex gap-3 pt-1">

function ItemsScreen({ items, setItems, categories, suppliers, movements, showToast }){
  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("");
  const [formModal, setFormModal] = useState(null); // {mode:'new'|'edit', data}
  const [detail, setDetail] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [scanning, setScanning] = useState(false);

  const filtered = items.filter(i => {
    const matchesSearch = !search || i.name.toLowerCase().includes(search.toLowerCase()) || i.code.includes(search) || i.location.toLowerCase().includes(search.toLowerCase());
    const matchesCat = !catFilter || i.categoryId === catFilter;
    return matchesSearch && matchesCat;
  });

  const save = (data) => {
    if(formModal.mode === "new"){
      setItems(prev => [...prev, { id: uid("item"), ...data }]);
      showToast("Item cadastrado com sucesso.", "success");
    }else{
      setItems(prev => prev.map(i => i.id===formModal.data.id ? { ...i, ...data } : i));
      showToast("Item atualizado.", "success");
      setDetail(prev => prev ? { ...prev, ...data } : prev);
    }
    setFormModal(null);
  };

  const remove = (item) => {
    setItems(prev => prev.filter(i=>i.id!==item.id));
    showToast("Item excluído.", "success");
    setConfirm(null);
    setDetail(null);
  };

  return (
    <div className="px-4 py-5 pb-24">
      <button onClick={()=>setFormModal({ mode:"new" })} className="btn-press w-full rounded-2xl py-4 bg-[var(--amber)] text-[#1A1305] font-display font-semibold uppercase tracking-wide flex items-center justify-center gap-2 mb-4 shadow-lg">
        <Icon name="plus" size={20}/> Novo Item
      </button>

      <div className="flex gap-2 mb-3">
        <div className="relative flex-1">
          <Icon name="search" size={18} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--dim)]"/>
          <input className={inputCls+" rounded-xl pl-10"} placeholder="Buscar por nome, código ou local..." value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <button onClick={()=>setScanning(true)} className="shrink-0 w-12 rounded-xl bg-[var(--amber)] text-[#1A1305] flex items-center justify-center btn-press"><Icon name="qr" size={18}/></button>
      </div>

      {scanning && (
        <ScannerModal
          showToast={showToast}
          onClose={()=>setScanning(false)}
          onDetected={(code)=>{
            setScanning(false);
            const found = items.find(i => i.code === code);
            if(found){ setSearch(""); setDetail(found); showToast(`Item localizado: ${found.name}`, "success"); }
            else { setSearch(code); showToast("Nenhum item cadastrado com esse código.", "error"); }
          }}
        />
      )}

      <div className="flex gap-2 overflow-x-auto scrollbar-none pb-1 mb-4 -mx-4 px-4">
        <button onClick={()=>setCatFilter("")} className={`shrink-0 px-3.5 py-2 rounded-full text-xs font-semibold border ${!catFilter ? "bg-[var(--amber)] text-[#1A1305] border-[var(--amber)]":"bg-[var(--surface2)] border-[var(--border)] text-[var(--dim)]"}`}>Todas</button>
        {categories.map(c => (
          <button key={c.id} onClick={()=>setCatFilter(c.id)} className={`shrink-0 px-3.5 py-2 rounded-full text-xs font-semibold border ${catFilter===c.id ? "bg-[var(--amber)] text-[#1A1305] border-[var(--amber)]":"bg-[var(--surface2)] border-[var(--border)] text-[var(--dim)]"}`}>{c.name}</button>
        ))}
      </div>

      <div className="space-y-2.5">
        {filtered.map(item => {
          const stock = computeStock(item, movements);
          const low = stock <= item.minStock;
          const cat = categories.find(c=>c.id===item.categoryId);
          return (
            <button key={item.id} onClick={()=>setDetail(item)} className="btn-press w-full text-left bg-[var(--surface)] border border-[var(--border)] rounded-xl p-3.5 flex items-center gap-3">
              <div className="w-14 h-14 rounded-lg bg-[var(--surface2)] overflow-hidden shrink-0 flex items-center justify-center">
                {item.photo ? <img src={item.photo} className="w-full h-full object-cover"/> : <Icon name="box" size={22} className="text-[var(--dim)]"/>}
              </div>
              <div className="min-w-0 flex-1">
                <p className="font-medium truncate">{item.name}</p>
                <p className="text-[11px] text-[var(--dim)] font-mono">{item.code}</p>
                <div className="flex items-center gap-1.5 mt-1">
                  {cat && <span className="w-2 h-2 rounded-full" style={{ background:cat.color }}></span>}
                  <span className="text-[11px] text-[var(--dim)] truncate">{cat?.name} · {item.location}</span>
                </div>
              </div>
              <div className="text-right shrink-0">
                <p className="font-display font-bold text-lg" style={{ color: low ? "var(--red)" : "var(--text)" }}>{stock}</p>
                <p className="text-[10px] text-[var(--dim)] uppercase">{item.unit}</p>
                {!item.active && <Badge>Inativo</Badge>}
              </div>
            </button>
          );
        })}
        {filtered.length===0 && <p className="text-sm text-[var(--dim)] text-center py-10">Nenhum item encontrado.</p>}
      </div>

      {formModal && (
        <Modal title={formModal.mode==="new" ? "Novo Item" : "Editar Item"} onClose={()=>setFormModal(null)} wide>
          <ItemForm
            initial={formModal.mode==="edit" ? formModal.data : null}
            categories={categories} suppliers={suppliers}
            onSave={save} onCancel={()=>setFormModal(null)} showToast={showToast}
          />
        </Modal>
      )}

      {detail && (
        <ItemDetail
          item={items.find(i=>i.id===detail.id) || detail}
          categories={categories} suppliers={suppliers} movements={movements}
          onClose={()=>setDetail(null)}
          onEdit={()=>{ setFormModal({ mode:"edit", data: detail }); setDetail(null); }}
          onDelete={()=>setConfirm(detail)}
        />
      )}

      <ConfirmDialog open={!!confirm} title="Excluir item?" message={`Tem certeza que deseja excluir "${confirm?.name}"? Todo o histórico de movimentações associado permanecerá registrado.`} onConfirm={()=>remove(confirm)} onCancel={()=>setConfirm(null)} />
    </div>
  );
}

/* ----------------------------- Entrada / Saída ----------------------------- */

function MovementScreen({ type, items, movements, setMovements, user, showToast }){
  const t = MOV_TYPES[type];
  const [itemId, setItemId] = useState("");
  const [quantity, setQuantity] = useState("");
  const [datetime, setDatetime] = useState(toDatetimeLocal());
  const [requester, setRequester] = useState("");
  const [os, setOs] = useState("");
  const [costCenter, setCostCenter] = useState("");
  const [note, setNote] = useState("");
  const [search, setSearch] = useState("");
  const [scanning, setScanning] = useState(false);

  const selected = items.find(i=>i.id===itemId);
  const stock = selected ? computeStock(selected, movements) : 0;

  const filteredItems = items.filter(i => i.active && (!search || i.name.toLowerCase().includes(search.toLowerCase()) || i.code.includes(search)));

  const reset = () => { setItemId(""); setQuantity(""); setRequester(""); setOs(""); setCostCenter(""); setNote(""); setDatetime(toDatetimeLocal()); setSearch(""); };

  const submit = () => {
    if(!selected) return showToast("Selecione um item.", "error");
    const qty = Number(quantity);
    if(!qty || qty <= 0) return showToast("Informe uma quantidade válida.", "error");
    if(type === "saida" && qty > stock){
      return showToast(`Saída bloqueada: quantidade (${qty}) maior que o estoque disponível (${stock}).`, "error");
    }
    if(!user) return showToast("Sessão inválida.", "error");

    const mov = {
      id: uid("mov"), itemId: selected.id, type: type, quantity: qty,
      datetime: new Date(datetime).toISOString(), responsible: user.name,
      requester: requester || "-", os: os || "-", costCenter: costCenter || "-", note,
    };
    setMovements(prev => [...prev, mov]);
    showToast(`${t.label} registrada com sucesso.`, "success");
    reset();
  };

  return (
    <div className="px-4 py-5 pb-24 space-y-4">
      <div className="rounded-2xl p-4 flex items-center gap-3" style={{ background: t.color+"14", border:`1px solid ${t.color}44` }}>
        <div className="w-11 h-11 rounded-xl flex items-center justify-center" style={{ background: t.color+"26", color: t.color }}>
          <Icon name={type==="saida"?"out":"in"} size={22}/>
        </div>
        <div>
          <p className="font-display font-semibold uppercase tracking-wide" style={{ color: t.color }}>{t.label} de Material</p>
          <p className="text-xs text-[var(--dim)]">Responsável: {user?.name}</p>
        </div>
      </div>

      <Field label="Buscar Item" required>
        <div className="flex gap-2">
          <div className="relative flex-1">
            <Icon name="search" size={17} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--dim)]"/>
            <input className={inputCls+" rounded-xl pl-10"} placeholder="Nome ou código..." value={search} onChange={e=>{ setSearch(e.target.value); setItemId(""); }}/>
          </div>
          <button onClick={()=>setScanning(true)} className="shrink-0 w-12 rounded-xl flex items-center justify-center btn-press" style={{ background:t.color, color: type==="entrada"||type==="devolucao" ? "#08210F" : "white" }}>
            <Icon name="qr" size={18}/>
          </button>
        </div>
      </Field>

      {scanning && (
        <ScannerModal
          showToast={showToast}
          onClose={()=>setScanning(false)}
          onDetected={(code)=>{
            setScanning(false);
            const found = items.find(i => i.code === code || i.code.includes(code) || code.includes(i.code));
            if(found){ setItemId(found.id); setSearch(""); showToast(`Item localizado: ${found.name}`, "success"); }
            else { setSearch(code); showToast("Código lido, mas nenhum item cadastrado corresponde a ele.", "error"); }
          }}
        />
      )}

      {search && !selected && (
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-xl max-h-52 overflow-y-auto divide-y divide-[var(--border)]">
          {filteredItems.slice(0,20).map(i => (
            <button key={i.id} onClick={()=>{ setItemId(i.id); setSearch(""); }} className="w-full text-left px-3.5 py-2.5 flex items-center justify-between btn-press">
              <div className="min-w-0">
                <p className="text-sm font-medium truncate">{i.name}</p>
                <p className="text-[11px] text-[var(--dim)] font-mono">{i.code}</p>
              </div>
              <span className="text-xs text-[var(--dim)] shrink-0 ml-2">{computeStock(i,movements)} {i.unit}</span>
            </button>
          ))}
          {filteredItems.length===0 && <p className="text-sm text-[var(--dim)] p-3.5">Nenhum item encontrado.</p>}
        </div>
      )}

      {selected && (
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-xl p-3.5 flex items-center gap-3">
          <div className="w-12 h-12 rounded-lg bg-[var(--surface2)] overflow-hidden shrink-0 flex items-center justify-center">
            {selected.photo ? <img src={selected.photo} className="w-full h-full object-cover"/> : <Icon name="box" size={18} className="text-[var(--dim)]"/>}
          </div>
          <div className="flex-1 min-w-0">
            <p className="font-medium truncate">{selected.name}</p>
            <p className="text-xs text-[var(--dim)]">Estoque atual: <span className="font-mono font-semibold" style={{color: stock<=selected.minStock ? "var(--red)":"var(--text)"}}>{stock} {selected.unit}</span></p>
          </div>
          <button onClick={()=>{ setItemId(""); }} className="w-8 h-8 rounded-lg bg-[var(--surface2)] flex items-center justify-center btn-press shrink-0"><Icon name="close" size={15}/></button>
        </div>
      )}

      <Field label={`Quantidade (${selected?.unit||"UN"})`} required>
        <input type="number" min="1" className={inputCls+" rounded-xl text-lg font-mono"} value={quantity} onChange={e=>setQuantity(e.target.value)} placeholder="0"/>
        {type==="saida" && selected && Number(quantity) > stock && (
          <p className="text-xs text-[var(--red)] mt-1.5 flex items-center gap-1"><Icon name="alert" size={13}/> Quantidade maior que o estoque disponível ({stock}).</p>
        )}
      </Field>

      <Field label="Data e Hora" required>
        <input type="datetime-local" className={inputCls+" rounded-xl"} value={datetime} onChange={e=>setDatetime(e.target.value)}/>
      </Field>

      <div className="grid grid-cols-2 gap-3">
        <Field label="Solicitante"><input className={inputCls+" rounded-xl"} value={requester} onChange={e=>setRequester(e.target.value)} placeholder="Nome / setor"/></Field>
        <Field label="OS"><input className={inputCls+" rounded-xl"} value={os} onChange={e=>setOs(e.target.value)} placeholder="Nº da OS"/></Field>
      </div>

      <Field label="Centro de Custo"><input className={inputCls+" rounded-xl"} value={costCenter} onChange={e=>setCostCenter(e.target.value)} placeholder="ex: CC-102 Manutenção"/></Field>
      <Field label="Observação"><textarea rows="2" className={inputCls+" rounded-xl resize-none"} value={note} onChange={e=>setNote(e.target.value)} placeholder="Informações adicionais"/></Field>

      <button onClick={submit} className="btn-press w-full rounded-2xl py-4 font-display font-semibold uppercase tracking-wide shadow-lg" style={{ background:t.color, color: type==="entrada"||type==="devolucao" ? "#08210F" : "white" }}>
        Confirmar {t.label}
      </button>

      <RecentMovementsList movements={movements} items={items} type={type} />
    </div>
  );
}

function RecentMovementsList({ movements, items, type }){
  const list = movements.filter(m=>m.type===type).sort((a,b)=> new Date(b.datetime)-new Date(a.datetime)).slice(0,10);
  const itemMap = Object.fromEntries(items.map(i=>[i.id,i]));
  const t = MOV_TYPES[type];
  return (
    <div>
      <p className="text-xs uppercase tracking-widest text-[var(--dim)] font-semibold mb-2 px-1">Últimos Registros</p>
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl divide-y divide-[var(--border)]">
        {list.length===0 && <p className="text-sm text-[var(--dim)] p-4">Nenhum registro ainda.</p>}
        {list.map(m => {
          const it = itemMap[m.itemId];
          return (
            <div key={m.id} className="px-4 py-3">
              <div className="flex items-center justify-between">
                <p className="text-sm font-medium truncate">{it?.name || "Item removido"}</p>
                <span className="font-mono text-sm font-semibold" style={{color:t.color}}>{m.quantity} {it?.unit}</span>
              </div>
              <p className="text-[11px] text-[var(--dim)] mt-0.5">{formatDateTime(m.datetime)} · {m.responsible} {m.os!=="-" && `· ${m.os}`}</p>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* -------------------------------- Inventário -------------------------------- */

function InventoryScreen({ items, categories, movements, setMovements, user, showToast }){
  const [search, setSearch] = useState("");
  const [catFilter, setCatFilter] = useState("");
  const [adjustItem, setAdjustItem] = useState(null);
  const [countValue, setCountValue] = useState("");

  const filtered = items.filter(i => i.active && (!search || i.name.toLowerCase().includes(search.toLowerCase()) || i.code.includes(search)) && (!catFilter || i.categoryId===catFilter));

  const openAdjust = (item) => { setAdjustItem(item); setCountValue(String(computeStock(item, movements))); };

  const applyAdjust = () => {
    const counted = Number(countValue);
    if(isNaN(counted) || counted < 0) return showToast("Informe uma contagem válida.", "error");
    const current = computeStock(adjustItem, movements);
    const diff = counted - current;
    if(diff === 0){ showToast("Nenhuma diferença encontrada."); setAdjustItem(null); return; }
    const mov = {
      id: uid("mov"), itemId: adjustItem.id, type: "ajuste", quantity: diff,
      datetime: nowISO(), responsible: user.name, requester: "-", os: "-",
      costCenter: "-", note: `Ajuste de inventário: contagem física = ${counted}`,
    };
    setMovements(prev => [...prev, mov]);
    showToast(`Ajuste registrado: ${diff>0?"+":""}${diff} ${adjustItem.unit}.`, "success");
    setAdjustItem(null);
  };

  const totalCounted = filtered.length;

  return (
    <div className="px-4 py-5 pb-24">
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4 mb-4 flex items-center gap-3">
        <Icon name="clipboard" size={22} className="text-[var(--amber)]"/>
        <div>
          <p className="font-display font-semibold uppercase">Contagem de Inventário</p>
          <p className="text-xs text-[var(--dim)]">{totalCounted} itens listados · toque em um item para ajustar o saldo</p>
        </div>
      </div>

      <div className="relative mb-3">
        <Icon name="search" size={18} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--dim)]"/>
        <input className={inputCls+" rounded-xl pl-10"} placeholder="Buscar item..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      <div className="flex gap-2 overflow-x-auto scrollbar-none pb-1 mb-4 -mx-4 px-4">
        <button onClick={()=>setCatFilter("")} className={`shrink-0 px-3.5 py-2 rounded-full text-xs font-semibold border ${!catFilter ? "bg-[var(--amber)] text-[#1A1305] border-[var(--amber)]":"bg-[var(--surface2)] border-[var(--border)] text-[var(--dim)]"}`}>Todas</button>
        {categories.map(c => (
          <button key={c.id} onClick={()=>setCatFilter(c.id)} className={`shrink-0 px-3.5 py-2 rounded-full text-xs font-semibold border ${catFilter===c.id ? "bg-[var(--amber)] text-[#1A1305] border-[var(--amber)]":"bg-[var(--surface2)] border-[var(--border)] text-[var(--dim)]"}`}>{c.name}</button>
        ))}
      </div>

      <div className="space-y-2">
        {filtered.map(item => {
          const stock = computeStock(item, movements);
          const low = stock <= item.minStock;
          return (
            <button key={item.id} onClick={()=>openAdjust(item)} className="btn-press w-full text-left bg-[var(--surface)] border border-[var(--border)] rounded-xl p-3.5 flex items-center gap-3">
              <div className="flex-1 min-w-0">
                <p className="font-medium truncate">{item.name}</p>
                <p className="text-[11px] text-[var(--dim)] font-mono">{item.code} · {item.location}</p>
              </div>
              <div className="text-right shrink-0">
                <p className="font-display font-bold text-lg" style={{ color: low ? "var(--red)":"var(--text)" }}>{stock}</p>
                <p className="text-[10px] text-[var(--dim)] uppercase">{item.unit}</p>
              </div>
              <Icon name="edit" size={16} className="text-[var(--dim)]"/>
            </button>
          );
        })}
      </div>

      {adjustItem && (
        <Modal title="Ajuste de Inventário" onClose={()=>setAdjustItem(null)}>
          <div className="space-y-4">
            <div className="bg-[var(--surface2)] rounded-xl p-3.5">
              <p className="font-medium">{adjustItem.name}</p>
              <p className="text-xs text-[var(--dim)] font-mono mt-0.5">{adjustItem.code}</p>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div className="bg-[var(--surface2)] rounded-xl p-3 text-center">
                <p className="font-display text-xl font-bold">{computeStock(adjustItem, movements)}</p>
                <p className="text-[10px] text-[var(--dim)] uppercase mt-0.5">Estoque no Sistema</p>
              </div>
              <Field label="Contagem Física" required>
                <input type="number" min="0" autoFocus className={inputCls+" rounded-xl text-center font-mono text-lg"} value={countValue} onChange={e=>setCountValue(e.target.value)}/>
              </Field>
            </div>
            <button onClick={applyAdjust} className="btn-press w-full rounded-xl py-3.5 bg-[var(--amber)] text-[#1A1305] font-display font-semibold uppercase tracking-wide">Registrar Ajuste</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* -------------------------------- Relatórios -------------------------------- */

function ReportsScreen({ items, categories, suppliers, movements, showToast }){
  const rows = items.map(i => ({
    item: i, stock: computeStock(i, movements), total: computeStock(i, movements) * Number(i.cost||0),
  }));
  const totalValue = rows.reduce((a,r)=>a+r.total,0);
  const totalUnits = rows.reduce((a,r)=>a+r.stock,0);

  const byCategory = categories.map(c => {
    const rs = rows.filter(r=>r.item.categoryId===c.id);
    return { category:c, count: rs.length, value: rs.reduce((a,r)=>a+r.total,0) };
  }).filter(c=>c.count>0);

  const exportCSV = () => {
    const header = ["Codigo","Nome","Categoria","Fornecedor","Unidade","Localizacao","EstoqueAtual","EstoqueMinimo","CustoUnitario","ValorTotal"];
    const lines = rows.map(r => [
      r.item.code, `"${r.item.name.replace(/"/g,'""')}"`,
      categories.find(c=>c.id===r.item.categoryId)?.name || "",
      suppliers.find(s=>s.id===r.item.supplierId)?.name || "",
      r.item.unit, r.item.location, r.stock, r.item.minStock,
      r.item.cost.toFixed(2), r.total.toFixed(2),
    ].join(";"));
    const csv = [header.join(";"), ...lines].join("\n");
    const blob = new Blob(["\uFEFF"+csv], { type:"text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `relatorio-estoque-${new Date().toISOString().slice(0,10)}.csv`;
    a.click(); URL.revokeObjectURL(url);
    showToast("Relatório exportado em CSV.", "success");
  };

  return (
    <div className="px-4 py-5 pb-24 space-y-4">
      <div className="grid grid-cols-2 gap-3">
        <StatCard label="Valor Total em Estoque" value={formatBRL(totalValue)} icon="chart" tone="green"/>
        <StatCard label="Unidades Totais" value={totalUnits} icon="box" tone="blue"/>
      </div>

      <button onClick={exportCSV} className="btn-press w-full rounded-2xl py-4 bg-[var(--amber)] text-[#1A1305] font-display font-semibold uppercase tracking-wide flex items-center justify-center gap-2 shadow-lg">
        <Icon name="download" size={19}/> Exportar Relatório (CSV)
      </button>

      <div>
        <p className="text-xs uppercase tracking-widest text-[var(--dim)] font-semibold mb-2 px-1">Valor por Categoria</p>
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl divide-y divide-[var(--border)]">
          {byCategory.map(c => (
            <div key={c.category.id} className="flex items-center gap-3 px-4 py-3">
              <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background:c.category.color }}></span>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-medium truncate">{c.category.name}</p>
                <p className="text-[11px] text-[var(--dim)]">{c.count} item(ns)</p>
              </div>
              <p className="font-mono font-semibold text-sm">{formatBRL(c.value)}</p>
            </div>
          ))}
        </div>
      </div>

      <div>
        <p className="text-xs uppercase tracking-widest text-[var(--dim)] font-semibold mb-2 px-1">Estoque Detalhado</p>
        <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl divide-y divide-[var(--border)]">
          {rows.map(r => (
            <div key={r.item.id} className="flex items-center gap-3 px-4 py-3">
              <div className="flex-1 min-w-0">
                <p className="text-sm font-medium truncate">{r.item.name}</p>
                <p className="text-[11px] text-[var(--dim)] font-mono">{r.item.code}</p>
              </div>
              <div className="text-right shrink-0">
                <p className="font-mono text-sm font-semibold">{r.stock} {r.item.unit}</p>
                <p className="text-[11px] text-[var(--dim)]">{formatBRL(r.total)}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* --------------------------- Abaixo do Mínimo --------------------------- */

function LowStockScreen({ items, categories, suppliers, movements, setRoute }){
  const rows = items.filter(i=>i.active).map(i => ({ item:i, stock: computeStock(i, movements) })).filter(r=>r.stock <= r.item.minStock);
  rows.sort((a,b) => (a.stock/Math.max(a.item.minStock,1)) - (b.stock/Math.max(b.item.minStock,1)));

  return (
    <div className="px-4 py-5 pb-24 space-y-4">
      <div className="bg-[var(--red)]/10 border border-[var(--red)]/30 rounded-2xl p-4 flex items-center gap-3">
        <Icon name="alert" size={24} className="text-[var(--red)]"/>
        <div>
          <p className="font-display font-semibold uppercase text-[var(--red)]">{rows.length} Item(ns) Crítico(s)</p>
          <p className="text-xs text-[var(--dim)]">Estoque no ou abaixo do nível mínimo definido</p>
        </div>
      </div>

      <div className="space-y-2.5">
        {rows.map(({ item, stock }) => {
          const cat = categories.find(c=>c.id===item.categoryId);
          const sup = suppliers.find(s=>s.id===item.supplierId);
          const pct = item.minStock > 0 ? Math.min(100, Math.round((stock/item.minStock)*100)) : 0;
          const zero = stock <= 0;
          return (
            <div key={item.id} className="bg-[var(--surface)] border border-[var(--red)]/30 rounded-xl p-3.5">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 rounded-lg bg-[var(--surface2)] overflow-hidden shrink-0 flex items-center justify-center">
                  {item.photo ? <img src={item.photo} className="w-full h-full object-cover"/> : <Icon name="box" size={18} className="text-[var(--dim)]"/>}
                </div>
                <div className="flex-1 min-w-0">
                  <p className="font-medium truncate">{item.name}</p>
                  <p className="text-[11px] text-[var(--dim)] truncate">{cat?.name} · {sup?.name}</p>
                </div>
                <div className="text-right shrink-0">
                  <p className="font-display font-bold text-lg text-[var(--red)]">{stock}<span className="text-xs text-[var(--dim)] font-normal">/{item.minStock}</span></p>
                  <Badge tone={zero ? "red":"amber"}>{zero ? "Esgotado":"Crítico"}</Badge>
                </div>
              </div>
              <div className="mt-2.5 h-1.5 rounded-full bg-[var(--surface2)] overflow-hidden">
                <div className="h-full bg-[var(--red)] rounded-full" style={{ width: `${pct}%` }}></div>
              </div>
            </div>
          );
        })}
        {rows.length===0 && (
          <div className="text-center py-14">
            <Icon name="check" size={36} className="text-[var(--green)] mx-auto mb-3"/>
            <p className="text-sm text-[var(--dim)]">Todos os itens estão dentro do nível mínimo de estoque.</p>
          </div>
        )}
      </div>

      {rows.length>0 && (
        <button onClick={()=>setRoute("entrada")} className="btn-press w-full rounded-2xl py-4 bg-[var(--amber)] text-[#1A1305] font-display font-semibold uppercase tracking-wide flex items-center justify-center gap-2 shadow-lg">
          <Icon name="in" size={20}/> Registrar Entrada
        </button>
      )}
    </div>
  );
}

/* ----------------------------------- App ----------------------------------- */

const ROUTE_TITLES = {
  dashboard: "Dashboard", itens: "Itens", categorias: "Categorias", fornecedores: "Fornecedores",
  entrada: "Entrada de Material", saida: "Saída de Material", inventario: "Inventário",
  relatorios: "Relatório de Estoque", minimo: "Abaixo do Mínimo",
};

function App(){
  const [db, setDb] = useState(() => loadDB());
  const [user, setUser] = useState(() => {
    try{ const raw = sessionStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  });
  const [route, setRoute] = useState("dashboard");
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [toast, showToast] = useToast();

  useEffect(() => { persistDB(db); }, [db]);

  const setItems = (updater) => setDb(prev => ({ ...prev, items: typeof updater==="function" ? updater(prev.items) : updater }));
  const setCategories = (updater) => setDb(prev => ({ ...prev, categories: typeof updater==="function" ? updater(prev.categories) : updater }));
  const setSuppliers = (updater) => setDb(prev => ({ ...prev, suppliers: typeof updater==="function" ? updater(prev.suppliers) : updater }));
  const setMovements = (updater) => setDb(prev => ({ ...prev, movements: typeof updater==="function" ? updater(prev.movements) : updater }));

  const handleLogin = (u) => {
    setUser(u);
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(u));
    setRoute("dashboard");
  };
  const handleLogout = () => {
    setUser(null);
    sessionStorage.removeItem(SESSION_KEY);
    setDrawerOpen(false);
  };

  const lowCount = useMemo(() => db.items.filter(i=>i.active && computeStock(i, db.movements) <= i.minStock).length, [db.items, db.movements]);

  if(!user){
    return (
      <>
        <LoginScreen users={db.users} onLogin={handleLogin} />
        <Toast toast={toast}/>
      </>
    );
  }

  let screen;
  switch(route){
    case "itens": screen = <ItemsScreen items={db.items} setItems={setItems} categories={db.categories} suppliers={db.suppliers} movements={db.movements} showToast={showToast}/>; break;
    case "categorias": screen = <CategoriesScreen categories={db.categories} setCategories={setCategories} items={db.items} showToast={showToast}/>; break;
    case "fornecedores": screen = <SuppliersScreen suppliers={db.suppliers} setSuppliers={setSuppliers} items={db.items} showToast={showToast}/>; break;
    case "entrada": screen = <MovementScreen type="entrada" items={db.items} movements={db.movements} setMovements={setMovements} user={user} showToast={showToast}/>; break;
    case "saida": screen = <MovementScreen type="saida" items={db.items} movements={db.movements} setMovements={setMovements} user={user} showToast={showToast}/>; break;
    case "inventario": screen = <InventoryScreen items={db.items} categories={db.categories} movements={db.movements} setMovements={setMovements} user={user} showToast={showToast}/>; break;
    case "relatorios": screen = <ReportsScreen items={db.items} categories={db.categories} suppliers={db.suppliers} movements={db.movements} showToast={showToast}/>; break;
    case "minimo": screen = <LowStockScreen items={db.items} categories={db.categories} suppliers={db.suppliers} movements={db.movements} setRoute={setRoute}/>; break;
    default: screen = <Dashboard items={db.items} categories={db.categories} movements={db.movements} setRoute={setRoute} user={user}/>;
  }

  return (
    <div className="min-h-screen pb-6">
      <TopBar title={ROUTE_TITLES[route]} onMenu={()=>setDrawerOpen(true)} />
      <Drawer open={drawerOpen} onClose={()=>setDrawerOpen(false)} route={route} setRoute={setRoute} user={user} onLogout={handleLogout} lowCount={lowCount} />
      {screen}
      <Toast toast={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
  // Transforma manualmente o JSX acima usando o Babel, forçando o modo
  // "classic" (React.createElement) em vez do runtime automático (que usa
  // "import" internamente e quebra fora de um ambiente de módulos ES).
  (function(){
    var sourceEl = document.getElementById("daga-app-source");
    var sourceCode = sourceEl.textContent;
    try {
      var output = Babel.transform(sourceCode, {
        presets: [["react", { runtime: "classic" }]],
        filename: "daga-app.jsx",
      }).code;
      var runScript = document.createElement("script");
      runScript.textContent = output;
      document.body.appendChild(runScript);
    } catch (err) {
      document.getElementById("root").innerHTML =
        '<div style="color:#EAF0F5;background:#0B1015;min-height:100vh;padding:24px;font-family:sans-serif;">' +
        '<h2 style="color:#E4574B;">Erro ao carregar o aplicativo</h2>' +
        '<pre style="white-space:pre-wrap;font-size:12px;opacity:.8;">' + String(err && err.message || err) + '</pre>' +
        '</div>';
      console.error("Erro ao transformar o JSX do DAGA WAREHOUSE:", err);
    }
  })();
</script>
</body>
</html>
